services:
  - type: web
    name: dogfood-judging-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dogfood-judging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ORGANIZER_INVITE_CODE
        generateValue: true
      - key: JUDGE_INVITE_CODE
        generateValue: true
      - key: PGPOOL_MAX
        value: "5"

databases:
  - name: dogfood-judging-db
    plan: basic-256mb
    databaseName: dogfood_judging
    user: dogfood_judging
