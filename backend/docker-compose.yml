services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dogfood_judging
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood_judging"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://dogfood:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/dogfood_judging
      PGSSL: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting Docker Compose}
      ORGANIZER_INVITE_CODE: ${ORGANIZER_INVITE_CODE:?Set ORGANIZER_INVITE_CODE before starting Docker Compose}
      JUDGE_INVITE_CODE: ${JUDGE_INVITE_CODE:?Set JUDGE_INVITE_CODE before starting Docker Compose}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
